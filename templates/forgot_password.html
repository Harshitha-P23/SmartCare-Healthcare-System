{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="auth-card">
                    <h3 class="fw-bold text-center mb-3">Reset your password</h3>
                    <p class="text-muted text-center">Enter your registered email address and we will help you recover your account.</p>
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill">Send reset link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
