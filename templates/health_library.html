{% extends 'base.html' %}
{% block title %}SmartCare | Health Library{% endblock %}
{% block content %}
<section class="page-banner">
    <div class="container">
        <h1 class="fw-bold mb-2">Health library</h1>
        <p class="mb-0 text-white-50">Helpful wellness articles and preventive health insights.</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row g-4">
            {% for article in articles %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 p-4">
                    <div class="mb-3 text-primary fs-2"><i class="fa-solid fa-book-medical"></i></div>
                    <h5 class="fw-bold">{{ article.title }}</h5>
                    <p class="text-muted mb-0">{{ article.summary }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
