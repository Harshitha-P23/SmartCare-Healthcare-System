{% extends 'base.html' %}
{% block title %}SmartCare | Register{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-1">Create an account</h2>
                        <p class="text-muted">Join SmartCare to manage your healthcare journey</p>
                    </div>
                    <form method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full name</label>
                                <input type="text" name="full_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone number</label>
                                <input type="tel" name="phone" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Date of birth</label>
                                <input type="date" name="dob" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Gender</label>
                                <select name="gender" class="form-select" required>
                                    <option value="">Select</option>
                                    <option>Female</option>
                                    <option>Male</option>
                                    <option>Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Address</label>
                                <input type="text" name="address" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control" required>
                                <div class="password-strength mt-2">
                                    <div id="passwordStrengthBar" class="password-strength-bar"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirm password</label>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill mt-4">Register</button>
                    </form>
                    <p class="text-center mt-4 mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
