{% extends 'base.html' %}
{% block title %}SmartCare | Login{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-1">Welcome back</h2>
                        <p class="text-muted">Login to your SmartCare account</p>
                    </div>
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                            <a href="{{ url_for('forgot_password') }}" class="small text-primary text-decoration-none">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill">Login</button>
                    </form>
                    <p class="text-center mt-4 mb-0">New here? <a href="{{ url_for('register') }}" class="text-primary text-decoration-none">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
