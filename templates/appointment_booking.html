{% extends 'base.html' %}
{% block title %}SmartCare | Book Appointment{% endblock %}
{% block content %}
<section class="page-banner">
    <div class="container">
        <h1 class="fw-bold mb-2">Book appointment</h1>
        <p class="mb-0 text-white-50">Schedule a visit with {{ doctor.full_name }}</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <img src="{{ doctor.photo_url }}" alt="{{ doctor.full_name }}" style="width:72px;height:72px;object-fit:cover;border-radius:50%;">
                        <div>
                            <h4 class="fw-bold mb-1">{{ doctor.full_name }}</h4>
                            <p class="text-muted mb-0">{{ doctor.specialization }} • {{ doctor.clinic_name }}</p>
                        </div>
                    </div>
                    <form method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Appointment date</label>
                                <input type="date" name="appointment_date" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Time slot</label>
                                <select name="time_slot" class="form-select" required>
                                    <option value="">Select time</option>
                                    {% set slots = doctor.time_slots|replace('[','')|replace(']','')|replace("'", '')|replace('"','') %}
                                    {% set slot_list = slots.split(', ') %}
                                    {% for slot in slot_list %}
                                        <option value="{{ slot }}">{{ slot }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Reason for consultation</label>
                                <textarea name="reason" class="form-control" rows="4" required></textarea>
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-3">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Confirm booking</button>
                            <a href="{{ url_for('doctor_profile', doctor_id=doctor.id) }}" class="btn btn-outline-secondary rounded-pill px-4">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
