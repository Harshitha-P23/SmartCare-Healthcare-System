{% extends 'base.html' %}
{% block title %}SmartCare | Contact{% endblock %}
{% block content %}
<section class="page-banner">
    <div class="container">
        <h1 class="fw-bold mb-2">Contact us</h1>
        <p class="mb-0 text-white-50">We are here to answer your health and support questions.</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card p-4 h-100">
                    <h4 class="fw-bold mb-3">Send us a message</h4>
                    <form method="post">
                        <div class="mb-3">
                            <input type="text" class="form-control" name="name" placeholder="Your name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" name="email" placeholder="Your email" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" name="message" rows="5" placeholder="Type your message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Submit</button>
                    </form>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card p-4 h-100">
                    <h4 class="fw-bold mb-3">Reach out</h4>
                    <p class="text-muted"><i class="fa-solid fa-phone me-2 text-primary"></i>+91 98765 43210</p>
                    <p class="text-muted"><i class="fa-solid fa-envelope me-2 text-primary"></i>hello@smartcare.com</p>
                    <p class="text-muted"><i class="fa-solid fa-location-dot me-2 text-primary"></i>123 Wellness Avenue, Hyderabad</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
